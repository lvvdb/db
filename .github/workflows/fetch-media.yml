name: Fetch Higgsfield media

# Hand-off from Higgsfield's CDN into git. Runs whenever
# freshsqueeze/higgsfield/media.json changes on any branch. The runner has
# open internet, fetches the listed keyframes into the repo, downloads the
# listed clips to a temp folder, turns them into the frame sequence with
# freshsqueeze/higgsfield/extract-frames.sh, and commits the result back to
# the same branch. Commits made with GITHUB_TOKEN do not re-trigger this.
#
# media.json shape:
# {
#   "files": [{"url": "https://...", "path": "freshsqueeze/higgsfield/keyframes/k0.png"}],
#   "clips": ["https://...clip-01.mp4", "https://...clip-02.mp4"],
#   "count": 96
# }

on:
  push:
    branches: ['**']
    paths: ['freshsqueeze/higgsfield/media.json']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch files into the repo
        run: |
          set -euo pipefail
          jq -c '.files // [] | .[]' freshsqueeze/higgsfield/media.json | while read -r entry; do
            url="$(jq -r .url <<<"$entry")"
            path="$(jq -r .path <<<"$entry")"
            case "$path" in
              freshsqueeze/*) ;;
              *) echo "refusing path outside freshsqueeze/: $path"; exit 1 ;;
            esac
            case "$path" in
              *..*) echo "refusing path with ..: $path"; exit 1 ;;
            esac
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 3 --retry-delay 2 -o "$path" "$url"
            echo "fetched $path ($(stat -c %s "$path") bytes)"
          done

      - name: Download clips and extract frames
        run: |
          set -euo pipefail
          n="$(jq '.clips // [] | length' freshsqueeze/higgsfield/media.json)"
          if [ "$n" -eq 0 ]; then echo "no clips listed"; exit 0; fi
          count="$(jq -r '.count // 96' freshsqueeze/higgsfield/media.json)"
          mkdir -p /tmp/clips
          i=0
          jq -r '.clips[]' freshsqueeze/higgsfield/media.json | while read -r url; do
            i=$((i+1))
            curl -fsSL --retry 3 --retry-delay 2 -o "$(printf '/tmp/clips/clip-%02d.mp4' "$i")" "$url"
          done
          ls -la /tmp/clips
          ffmpeg -version | head -1
          bash freshsqueeze/higgsfield/extract-frames.sh /tmp/clips "$count" 1280
          ls freshsqueeze/frames | wc -l
          cat freshsqueeze/frames/manifest.js

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A freshsqueeze
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Fetch Higgsfield media into freshsqueeze"
          git push
